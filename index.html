<body>
<div class="app">
<header class="topbar">
<button class="menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
<div class="brand"><span class="brand-mark">I$T</span></div>
<div style="margin-left:auto" class="muted" id="headerDate"></div>
</header>
<aside class="drawer" id="drawer">
<div class="nav" id="nav"></div>
<div style="margin-top:18px" class="notice">Tus datos se guardan localmente en este dispositivo. Usa Exportar para crear una copia de seguridad.</div>
</aside>
<div class="drawer-backdrop" id="backdrop"></div>
<main class="page" id="appContent"></main>
<nav class="mobile-nav" id="mobileNav" aria-label="Navegación principal"></nav>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<script>
(() => {
"use strict";

/* ---------- Data model ---------- */
const STORAGE_KEY = "ist_finanzas_v22";
const LEGACY_STORAGE_KEYS = ["ist_finanzas_v21","ist_finanzas_v20"];
const DATA_VERSION = 22;
const VERSION = 20;

const defaultCategories = [
["Vivienda",["Alquiler","Hipoteca","Luz","Agua","Gas","Internet","Móvil","Comunidad","Seguro hogar","Mantenimiento","Muebles","Electrodomésticos","Otros vivienda"]],
["Alimentación",["Supermercado","Restaurante","Cafetería","Comida a domicilio","Comida trabajo","Otros alimentación"]],
["Transporte",["Gasolina","Transporte público","Taxi/VTC","Parking","Peajes","Mantenimiento coche","Seguro coche","ITV","Otros transporte"]],
["Compras",["Ropa","Calzado","Tecnología","Hogar","Belleza","Regalos","Compras online","Otros compras"]],
["Suscripciones",["Netflix","Spotify","Disney+","HBO Max","Amazon Prime","YouTube Premium","Apple","Google","Gaming","Prensa","Software","Otros suscripciones"]],
["Ocio",["Cine","Viajes","Restaurantes y ocio","Conciertos","Videojuegos","Deporte","Hobbies","Noche","Otros ocio"]],
["Salud",["Farmacia","Médico","Dentista","Fisioterapia","Seguro médico","Óptica","Otros salud"]],
["Finanzas",["Comisiones","Intereses","Impuestos","Seguros","Transferencias","Otros finanzas"]],
["Trabajo",["Dietas","Comidas trabajo","Transporte trabajo","Formación trabajo","Otros trabajo"]],
["Formación",["Universidad","Cursos","Libros","Material","Otros formación"]],
["Familia",["Aportación casa","Hijos","Pareja","Familia","Otros familia"]],
["Mascotas",["Alimentación","Veterinario","Higiene","Accesorios","Otros mascotas"]],
["Viajes",["Alojamiento","Vuelos","Tren","Coche alquiler","Comidas","Actividades","Otros viajes"]],
["Ingresos",["Nómina","Bonus","Dietas","Devolución","Intereses","Dividendos","Venta","Otros ingresos"]],
["Otros",["Otros"]]
];

const merchantMap = [
["netflix","🎬"],["spotify","🎵"],["disney","🏰"],["hbo","🎞️"],["max","🎞️"],["amazon","📦"],["prime","📦"],
["mercadona","🛒"],["carrefour","🛒"],["lidl","🛒"],["dia","🛒"],["alcampo","🛒"],["eroski","🛒"],
["repsol","⛽"],["cepsa","⛽"],["shell","⛽"],["bp","⛽"],["apple",""],["google","G"],["microsoft","▦"],
["uber","🚕"],["cabify","🚕"],["renfe","🚆"],["alsa","🚌"],["inditex","👕"],["zara","👕"],["mango","👗"],
["adidas","👟"],["nike","👟"],["decathlon","🏃"],["mediamarkt","💻"],["fnac","📚"],["el corte ingles","🏬"],
["corte ingles","🏬"],["ikea","🛋️"],["glovo","🛵"],["just eat","🍔"],["dominos","🍕"],["mcdonald","🍔"],
["burger king","🍔"],["starbucks","☕"],["air europa","✈️"],["ryanair","✈️"],["vueling","✈️"],["booking","🏨"],
["airbnb","🏠"],["revolut","💳"],["paypal","💸"],["steam","🎮"],["playstation","🎮"],["xbox","🎮"],["nintendo","🎮"],
["gym","🏋️"],["basic-fit","🏋️"],["amazon web services","☁️"]
];

function emptyState(){
 return {
  version:DATA_VERSION,
  accounts:[],
  movements:[],
  recurrings:[],
  investments:[],
  budgets:{},
  goals:[],
  categories: defaultCategories.map(([name,subs])=>({id:uid(),name,subcategories:subs.map(s=>({id:uid(),name:s}))})),
  settings:{currency:"EUR", defaultInterestRate:2.02, lastInterestRun:{}}
 };
}
let state = loadState();

function uid(){ return Math.random().toString(36).slice(2,10)+"-"+Date.now().toString(36); }
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function euro(v){return new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(v)||0);}
function dateISO(d=new Date()){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;}
function monthKey(d){const x=typeof d==="string"?new Date(d+"T12:00:00"):new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}`;}
function monthLabel(k){const [y,m]=k.split("-").map(Number);return new Intl.DateTimeFormat("es-ES",{month:"long",year:"numeric"}).format(new Date(y,m-1,1)).replace(/^./,c=>c.toUpperCase());}
function monthsBack(n=36){const now=new Date();now.setDate(1);return Array.from({length:n},(_,i)=>{const d=new Date(now);d.setMonth(d.getMonth()-i);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`});}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function normalizeV22State(x){
 if(!x||typeof x!=="object")return null;
 x.settings ||= {currency:"EUR",defaultInterestRate:2.02,lastInterestRun:{}};
 x.settings.lastInterestRun ||= {};
 x.categories ||= []; x.accounts ||= []; x.movements ||= []; x.recurrings ||= []; x.investments ||= [];
 x.budgets ||= {}; x.goals ||= [];
 x.version=DATA_VERSION;
 return x;
}
function backupState(raw,label){
 try{localStorage.setItem(`ist_backup_${label}_${Date.now()}`,JSON.stringify(raw));}catch(e){}
}

function ensureV25State(){
  state.settings ||= {};
  state.settings.profile ||= {};
  state.settings.profile.name ||= "";
  state.settings.profile.welcomeSeen ||= false;
  state.settings.budgetsV25 ||= {};
  state.settings.budgetAlerts ||= 80;
  return state;
}
function greetingForName(name){
  const h=new Date().getHours();
  const g=h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";
  return name ? `${g}, ${name} 👋` : `${g} 👋`;
}

function loadState(){
 try{
  const current=localStorage.getItem(STORAGE_KEY);
  if(current){const x=normalizeV22State(JSON.parse(current));if(x)return x;}
 }catch(e){}
 for(const key of LEGACY_STORAGE_KEYS){
  try{
   const rawText=localStorage.getItem(key);
   if(!rawText)continue;
   const raw=JSON.parse(rawText);
   backupState(raw,key.replace(/[^a-z0-9]/gi,""));
   const migrated=normalizeV22State(raw);
   localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));
   return migrated;
  }catch(e){}
 }
 return emptyState();
}
function byId(arr,id){return arr.find(x=>x.id===id);}
function totalBalance(){return state.accounts.reduce((a,b)=>a+Number(b.balance||0),0);}
function investmentTotal(){
 return state.investments.reduce((sum,i)=>sum+Number(i.marketValue??i.value??i.amount??0),0);
}
function availableBalance(){
 return state.accounts.filter(a=>!a.excludeFromAvailable).reduce((sum,a)=>sum+Number(a.balance||0),0);
}
function savingsBalance(){
 return state.accounts.filter(a=>/ahorro|remunerad|saving/i.test(String(a.type||"")+" "+String(a.name||""))).reduce((sum,a)=>sum+Number(a.balance||0),0);
}

function isTransfer(m){
 return m.type==="transfer" || m.transfer===true || m.kind==="transfer" || !!m.transferId;
}
function isFinancialMovement(m){
 return !isTransfer(m);
}
function movementSigned(m){
 const a=movementAmount(m);
 return m.type==="income" ? a : m.type==="expense" ? -a : 0;
}
function transferAccounts(m){
 return {from:m.fromAccountId||m.sourceAccountId||m.accountId||"",to:m.toAccountId||m.destinationAccountId||""};
}

function monthlyStats(k){
 const ms=state.movements.filter(m=>monthKey(m.date)===k);
 const financial=ms.filter(isFinancialMovement);
 const income=financial.filter(m=>m.type==="income").reduce((s,m)=>s+movementAmount(m),0);
 const expense=financial.filter(m=>m.type==="expense").reduce((s,m)=>s+movementAmount(m),0);
 return {ms,financial,income,expense,net:income-expense,rate:income?((income-expense)/income*100):0};
}
function categoryMonthlyAmount(k,cid,sid=""){
 return state.movements.filter(m=>monthKey(m.date)===k&&m.type==="expense"&&m.categoryId===cid&&(!sid||m.subcategoryId===sid)).reduce((s,m)=>s+movementAmount(m),0);
}
function goalProgress(g){
 const current=Number(g.current??0);
 return {current,target:Number(g.target||0),pct:g.target?Math.min(100,current/g.target*100):0};
}
function insightsForMonth(k){
 const cur=monthlyStats(k), prevKey=monthsBack(36)[monthsBack(36).indexOf(k)+1];
 const prev=prevKey?monthlyStats(prevKey):null, out=[];
 if(prev && prev.expense){const d=(cur.expense-prev.expense)/prev.expense*100;if(Math.abs(d)>=8)out.push((d>0?"🔴 ":"🟢 ")+`Gastos ${d>0?"+" : ""}${d.toFixed(1)}% frente al mes anterior.`);}
 if(cur.income>0) out.push(`${cur.net>=0?"🟢":"🔴"} Tasa de ahorro: ${cur.rate.toFixed(1)}%.`);
 const catTotals={};cur.ms.filter(m=>m.type==="expense").forEach(m=>{catTotals[m.categoryId]=(catTotals[m.categoryId]||0)+movementAmount(m)});
 const top=Object.entries(catTotals).sort((a,b)=>b[1]-a[1])[0];
 if(top)out.push(`📌 Mayor categoría: ${categoryById(top[0])?.name||"Sin categoría"} · ${euro(top[1])}.`);
 Object.entries(state.budgets||{}).forEach(([key,val])=>{if(key.startsWith(k+"|")){const cid=key.split("|")[1],spent=categoryMonthlyAmount(k,cid);const b=Number(val)||0;if(b&&spent/b>=.8)out.push(`${spent>b?"🔴":"🟠"} ${categoryById(cid)?.name||"Categoría"}: ${Math.round(spent/b*100)}% del presupuesto.`);}});
 return out.slice(0,5);
}

function movementAmount(m){return Number(m.amount)||0;}
function categoriesFlat(){return state.categories;}
function categoryById(id){return byId(state.categories,id);}
function subcategoryById(cid,sid){return categoryById(cid)?.subcategories?.find(s=>s.id===sid);}
function merchantVisual(name){
 const n=String(name||"").toLowerCase().trim();
 const hit=merchantMap.find(([k])=>n.includes(k));
 return hit?hit[1]:"●";
}

/* ---------- Daily interest ---------- */
function accrueInterest(){
 const today = new Date();
 const todayStr=dateISO(today);
 let changed=false;
 state.accounts.forEach(a=>{
  if(!a.remunerated) return;
  const rate=Number(a.rate||0);
  if(rate<=0) return;
  const last=state.settings.lastInterestRun[a.id] || dateISO(new Date(a.createdAt||todayStr));
  let d=new Date(last+"T12:00:00");
  d.setDate(d.getDate()+1);
  while(d<=today){
    // effective daily rate equivalent to annual TAE
    const daily=Math.pow(1+rate/100,1/365)-1;
    const interest=Number(a.balance||0)*daily;
    if(interest>0.0000001){
      a.balance=Number(a.balance||0)+interest;
      state.movements.push({id:uid(),date:dateISO(d),type:"income",amount:interest,accountId:a.id,categoryId:state.categories.find(c=>c.name==="Ingresos")?.id||"",subcategoryId:state.categories.find(c=>c.name==="Ingresos")?.subcategories.find(s=>s.name==="Intereses")?.id||"",merchant:"Interés diario",note:`Interés diario ${rate}% TAE`,system:true});
      changed=true;
    }
    d.setDate(d.getDate()+1);
  }
  state.settings.lastInterestRun[a.id]=todayStr;
 });
 if(changed) save();
}

/* ---------- UI shell ---------- */
const routes=[
 ["summary","🏠","Resumen"],["movements","↔️","Movimientos"],["accounts","🏦","Cuentas"],["recurrings","🔄","Recurrentes"],
 ["budgets","💰","Presupuestos"],["reports","📊","Informes"],["categories","🏷️","Categorías"],["investments","📈","Inversiones"],["settings","⚙️","Configuración"]
];
let currentRoute=localStorage.getItem("ist_route")||"summary";
const nav=document.getElementById("nav"), content=document.getElementById("appContent");

function setupTransferFields(){
 const typeSel=document.querySelector('select[name="type"],#movementType,#type');
 const box=document.getElementById("transferFields");
 const from=document.getElementById("transferFrom");
 const to=document.getElementById("transferTo");
 if(!typeSel||!box||!from||!to)return;
 const opts=state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join("");
 from.innerHTML=opts; to.innerHTML=opts;
 const toggle=()=>box.classList.toggle("hidden",typeSel.value!=="transfer");
 typeSel.addEventListener("change",toggle); toggle();
}

function renderNav(){nav.innerHTML=routes.map(r=>`<button data-route="${r[0]}" class="${currentRoute===r[0]?"active":""}"><span class="emoji">${r[1]}</span>${r[2]}</button>`).join("");}
function renderMobileNav(){const el=document.getElementById("mobileNav");if(!el)return;const main=["summary","movements","budgets","reports"].map(k=>routes.find(r=>r[0]===k)).filter(Boolean);el.innerHTML=main.slice(0,2).map(r=>`<button data-mroute="${r[0]}" class="${currentRoute===r[0]?"active":""}"><span class="micon">${r[1]}</span><span>${r[2]}</span></button>`).join("")+`<button class="add" data-addmovement="1" aria-label="Añadir movimiento">＋</button>`+main.slice(2).map(r=>`<button data-mroute="${r[0]}" class="${currentRoute===r[0]?"active":""}"><span class="micon">${r[1]}</span><span>${r[2]}</span></button>`).join("");}

function openMenu(){document.getElementById("drawer").classList.add("open");document.getElementById("backdrop").classList.add("open");}
function closeMenu(){document.getElementById("drawer").classList.remove("open");document.getElementById("backdrop").classList.remove("open");}
document.getElementById("menuBtn").onclick=openMenu;
document.getElementById("backdrop").onclick=closeMenu;
nav.addEventListener("click",e=>{const b=e.target.closest("[data-route]");if(!b)return;currentRoute=b.dataset.route;localStorage.setItem("ist_route",currentRoute);renderNav();renderMobileNav();closeMenu();render();});
document.getElementById("mobileNav").addEventListener("click",e=>{const b=e.target.closest("[data-mroute],[data-addmovement]");if(!b)return;if(b.dataset.addmovement){currentRoute="movements";localStorage.setItem("ist_route",currentRoute);renderNav();renderMobileNav();render();setTimeout(()=>{const add=document.getElementById("addMovement");if(add)add.click();},40);return;}currentRoute=b.dataset.mroute;localStorage.setItem("ist_route",currentRoute);renderNav();renderMobileNav();render();});

document.getElementById("headerDate").textContent=new Intl.DateTimeFormat("es-ES",{dateStyle:"medium"}).format(new Date());

function selectOptions(items,value="",placeholder="Selecciona…"){return `<option value="">${esc(placeholder)}</option>`+items.map(x=>`<option value="${esc(x.value)}" ${x.value===value?"selected":""}>${esc(x.label)}</option>`).join("");}
function monthOptions(selected=""){return selectOptions(monthsBack(36).map(k=>({value:k,label:monthLabel(k)})),selected,"Selecciona mes");}
function accountOptions(selected=""){return selectOptions(state.accounts.map(a=>({value:a.id,label:a.name})),selected,"Selecciona cuenta");}
function categoryOptions(selected=""){return selectOptions(state.categories.map(c=>({value:c.id,label:c.name})),selected,"Selecciona categoría");}
function subcatOptions(cid,selected=""){const c=categoryById(cid);return selectOptions((c?.subcategories||[]).map(s=>({value:s.id,label:s.name})),selected,"Selecciona subcategoría");}
function modalOpen(title,body){
 document.getElementById("modalCard").innerHTML=`<div class="modal-head"><h2>${esc(title)}</h2><button class="close" id="modalClose">✕</button></div>${body}`;
 document.getElementById("modal").classList.add("open");
 document.getElementById("modalClose").onclick=modalClose;
}

/* ---------- Recurring ---------- */
function applyRecurrings(){
 const today=new Date(); let changed=false;
 state.recurrings.forEach(r=>{
  if(!r.active) return;
  const start=new Date(r.startDate+"T12:00:00");
  if(start>today) return;
  let cursor=r.lastApplied ? new Date(r.lastApplied+"T12:00:00") : new Date(start);
  // A recurring configured "today" should start next occurrence if its day is today.
  if(!r.lastApplied && dateISO(start)===dateISO(today)){ cursor.setMonth(cursor.getMonth()+1); }
  while(cursor<=today){
    const mk=monthKey(cursor);
    const existing=state.movements.some(m=>m.recurringId===r.id && monthKey(m.date)===mk);
    if(!existing && cursor>=start){
      state.movements.push({id:uid(),date:dateISO(cursor),type:r.type,amount:Number(r.amount),accountId:r.accountId,categoryId:r.categoryId,subcategoryId:r.subcategoryId,merchant:r.merchant,note:r.note||"",recurringId:r.id});
      const acc=byId(state.accounts,r.accountId);
      if(acc) acc.balance += r.type==="income"?Number(r.amount):-Number(r.amount);
      changed=true;
    }
    cursor.setMonth(cursor.getMonth()+1);
  }
  r.lastApplied=dateISO(today);
 });
 if(changed) save();
}

function recurringMonthInfo(k){
 const [y,m]=k.split("-").map(Number);
 const lastDay=new Date(y,m,0).getDate();
 const today=new Date();
 const isCurrent=k===monthKey(today);
 const items=state.recurrings.filter(r=>r.active!==false).map(r=>{
   const start=new Date(r.startDate+"T12:00:00");
   const startKey=monthKey(start);
   if(startKey>k) return null;
   const day=Math.min(start.getDate(),lastDay);
   const date=`${k}-${String(day).padStart(2,"0")}`;
   const already=state.movements.some(x=>x.recurringId===r.id && monthKey(x.date)===k);
   return {r,date,already};
 }).filter(Boolean).filter(x=>!isCurrent || x.date>=dateISO(today));
 return {items,isCurrent};
}


function budgetConfigKey(){return "ist_budget_config_v24";}
function loadBudgetConfig(){
 try{return JSON.parse(localStorage.getItem(budgetConfigKey())||"{}")}catch(e){return {}}
}
function saveBudgetConfig(x){try{localStorage.setItem(budgetConfigKey(),JSON.stringify(x))}catch(e){}}
function budgetForMonth(cid,k){
 const cfg=loadBudgetConfig()[cid];
 if(!cfg||!cfg.amount)return null;
 const start=cfg.startMonth||"0000-00";
 const end=cfg.endMonth||"9999-99";
 if(k<start||k>end)return null;
 let amount=Number(cfg.amount)||0;
 if(cfg.rollover){
  const months=monthsBack(36).filter(x=>x>=start&&x<k).reverse();
  for(const mo of months){
   const spent=categoryMonthlyAmount(mo,cid);
   amount=Math.max(0,amount-spent);
   amount+=Number(cfg.amount)||0;
  }
 }
 return {amount,base:Number(cfg.amount)||0,rollover:!!cfg.rollover};
}


function budgetV25Key(cid){ return String(cid); }
function getBudgetV25(cid){
  return (state.settings?.budgetsV25||{})[budgetV25Key(cid)] || null;
}
function activeBudgetV25(cid, monthKeyValue){
  const b=getBudgetV25(cid);
  if(!b || !b.amount) return null;
  const start=b.startMonth||"0000-00", end=b.endMonth||"9999-99";
  if(monthKeyValue<start || monthKeyValue>end) return null;
  let amount=Number(b.amount)||0;
  if(b.rollover){
    const startDate=new Date(start+"-01T12:00:00");
    const target=new Date(monthKeyValue+"-01T12:00:00");
    let cur=new Date(startDate);
    while(cur<target){
      const mk=monthKey(cur);
      const spent=categoryMonthlyAmount(mk,cid);
      const carry=Math.max(0,amount-spent);
      amount=(Number(b.amount)||0)+Math.min(carry, Number(b.rolloverCap||Infinity));
      cur.setMonth(cur.getMonth()+1);
    }
  }
  return {...b, effectiveAmount:amount};
}
function allBudgetRowsForMonth(k){
  const rows=[];
  Object.keys((state.settings&&state.settings.budgetsV25)||{}).forEach(cid=>{
    const b=activeBudgetV25(cid,k);
    if(!b) return;
    const spent=categoryMonthlyAmount(k,cid);
    const budget=Number(b.effectiveAmount||b.amount||0);
    rows.push({cid,name:categoryById(cid)?.name||"Categoría",spent,budget,pct:budget?spent/budget*100:0,b});
  });
  return rows;
}
function budgetStatus(pct){
  return pct>100?"over":pct>=Number(state.settings?.budgetAlerts||80)?"warn":"ok";

function movementTableRow(m){

}
function movementModal(id){
 const m=id?byId(state.movements,id):null;
 modalOpen(id?"Editar movimiento":"Nuevo movimiento",`<form id="movementForm" class="form-grid">
 <div class="field"><label>Tipo</label><select id="mType" required>${selectOptions([{value:"expense",label:"Gasto"},{value:"income",label:"Ingreso"}],m?.type,"Selecciona tipo")}</select></div>
 <div class="field"><label>Fecha</label><input id="mDate" type="date" value="${esc(m?.date||dateISO())}" required></div>
 <div class="field"><label>Importe (€)</label><input id="mAmount" type="number" min="0.01" step="0.01" value="${m?esc(m.amount):""}" required></div>
 <div class="field"><label>Cuenta</label><select id="mAccount" required>${accountOptions(m?.accountId||"")}</select></div>
 <div class="field"><label>Categoría</label><select id="mCat" required>${categoryOptions(m?.categoryId||"")}</select></div>
 <div class="field"><label>Subcategoría</label><select id="mSub" required>${subcatOptions(m?.categoryId||"",m?.subcategoryId||"")}</select></div>
 <div class="field full"><label>Comercio / concepto</label><input id="mMerchant" value="${esc(m?.merchant||"")}" placeholder="Ej. Netflix, Mercadona, nómina…"></div>
 <div class="field full"><label>Nota</label><textarea id="mNote" rows="2">${esc(m?.note||"")}</textarea></div>
 <div class="actions full"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="cancelM">Cancelar</button></div>
 
<div class="transfer-fields hidden" id="transferFields">
 <div class="field"><label>Cuenta origen</label><select id="transferFrom"></select></div>
 <div class="field"><label>Cuenta destino</label><select id="transferTo"></select></div>
</div>
</form>`);
 document.getElementById("cancelM").onclick=modalClose;
 document.getElementById("mCat").onchange=e=>{document.getElementById("mSub").innerHTML=subcatOptions(e.target.value)};
 document.getElementById("movementForm").onsubmit=e=>{
  e.preventDefault();
  const amount=Number(document.getElementById("mAmount").value);const accId=document.getElementById("mAccount").value;
  if(!accId||!amount||amount<=0){toast("Completa cuenta e importe.");return;}
  if(m){const old=movementAmount(m);const accOld=byId(state.accounts,m.accountId);if(accOld)accOld.balance += m.type==="income"?-old:old;}
  const obj=m||{id:uid()}; Object.assign(obj,{type:document.getElementById("mType").value,date:document.getElementById("mDate").value,amount,accountId:accId,categoryId:document.getElementById("mCat").value,subcategoryId:document.getElementById("mSub").value,merchant:document.getElementById("mMerchant").value.trim(),note:document.getElementById("mNote").value.trim()});
  if(!m)state.movements.push(obj);
  const acc=byId(state.accounts,accId);acc.balance += obj.type==="income"?amount:-amount;
  save();modalClose();render();toast("Movimiento guardado.");
 };
}
function deleteMovement(id){
 const m=byId(state.movements,id);if(!m)return;if(!confirm("¿Eliminar este movimiento?"))return;
 const acc=byId(state.accounts,m.accountId);if(acc)acc.balance += m.type==="income"?-movementAmount(m):movementAmount(m);
 state.movements=state.movements.filter(x=>x.id!==id);save();renderMovements();toast("Movimiento eliminado.");
}
function transferModal(){
 if(state.accounts.length<2){toast("Necesitas al menos dos cuentas.");return;}
 modalOpen("Nuevo traspaso",`<form id="transferForm" class="form-grid">
 <div class="field"><label>Fecha</label><input id="tDate" type="date" value="${dateISO()}" required></div>
 <div class="field"><label>Importe (€)</label><input id="tAmount" type="number" min="0.01" step="0.01" required></div>
 <div class="field"><label>Cuenta origen</label><select id="tFrom" required>${accountOptions("")}</select></div>
 <div class="field"><label>Cuenta destino</label><select id="tTo" required>${accountOptions("")}</select></div>
 <div class="field full"><label>Concepto</label><input id="tNote" value="Traspaso interno"></div>
 <div class="actions full"><button class="btn primary" type="submit">Guardar traspaso</button><button class="btn" type="button" id="cancelT">Cancelar</button></div></form>`);
 document.getElementById("cancelT").onclick=modalClose;
 document.getElementById("transferForm").onsubmit=e=>{
  e.preventDefault();const from=document.getElementById("tFrom").value,to=document.getElementById("tTo").value,amount=Number(document.getElementById("tAmount").value);
  if(from===to||!amount||amount<=0){toast("Origen y destino deben ser distintos y el importe válido.");return;}
  const a=byId(state.accounts,from),b=byId(state.accounts,to);if(!a||!b||a.balance<amount){toast("Saldo insuficiente o cuenta no válida.");return;}
  a.balance-=amount;b.balance+=amount;
  state.movements.push({id:uid(),date:document.getElementById("tDate").value,type:"transfer",amount,accountId:from,toAccountId:to,merchant:"Traspaso",note:document.getElementById("tNote").value});
  save();modalClose();render();toast("Traspaso realizado.");
 };
}

 content.querySelectorAll("[data-del-a]").forEach(b=>b.onclick=()=>deleteAccount(b.dataset.delA));

function accountIcon(type){return type==="Cuenta remunerada"?"💰":type==="Inversión"?"📈":type==="Tarjeta"?"💳":type==="Ahorro"?"🏦":"💶";}
function accountModal(id){
 const a=id?byId(state.accounts,id):null;
 modalOpen(id?"Editar cuenta":"Nueva cuenta",`<form id="accountForm" class="form-grid">
 <div class="field"><label>Nombre</label><input id="aName" value="${esc(a?.name||"")}" required></div>
 <div class="field"><label>Tipo de cuenta</label><select id="aType" required>${selectOptions([{value:"Cuenta corriente",label:"Cuenta corriente"},{value:"Ahorro",label:"Ahorro"},{value:"Cuenta remunerada",label:"Cuenta remunerada"},{value:"Inversión",label:"Inversión"},{value:"Tarjeta",label:"Tarjeta"},{value:"Otra",label:"Otra"}],a?.type||"","Selecciona tipo")}</select></div>
 <div class="field"><label>Saldo actual</label><input id="aBalance" type="number" step="0.01" value="${a?esc(a.balance):"0"}"></div>
 <div class="field"><label>Remunerada</label><select id="aRem"><option value="0" ${!a?.remunerated?"selected":""}>No</option><option value="1" ${a?.remunerated?"selected":""}>Sí</option></select></div>
 <div class="field"><label>TAE (%)</label><input id="aRate" type="number" min="0" step="0.001" value="${esc(a?.rate??state.settings.defaultInterestRate)}"></div>
 <div class="field full"><div class="notice">El interés diario se calcula individualmente para cada cuenta remunerada y se recuperan automáticamente los días pendientes cuando vuelves a abrir la app.</div></div>
 <div class="actions full"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="cancelA">Cancelar</button></div></form>`);
 document.getElementById("cancelA").onclick=modalClose;
 document.getElementById("accountForm").onsubmit=e=>{
  e.preventDefault();
  const name=document.getElementById("aName").value.trim();if(!name){toast("El nombre es obligatorio.");return;}
  const obj=a||{id:uid(),createdAt:dateISO()};
  Object.assign(obj,{name,type:document.getElementById("aType").value,balance:Number(document.getElementById("aBalance").value)||0,remunerated:document.getElementById("aRem").value==="1",rate:Number(document.getElementById("aRate").value)||0});
  if(!a)state.accounts.push(obj);

 };

function deleteAccount(id){
 if(state.movements.some(m=>m.accountId===id||m.toAccountId===id)){toast("No puedes eliminar una cuenta con movimientos.");return;}
 if(!confirm("¿Eliminar esta cuenta?"))return;state.accounts=state.accounts.filter(a=>a.id!==id);delete state.settings.lastInterestRun[id];save();renderAccounts();toast("Cuenta eliminada.");
}
function capitalModal(){

function reportFilteredMovements(r, override={}){
 let arr=state.movements.filter(m=>m.type!=="transfer");
 const type=override.type||r.type;
 if(type!=="both")arr=arr.filter(m=>m.type===type);
 if((override.account||r.account))arr=arr.filter(m=>m.accountId===(override.account||r.account));
 if((override.category||r.category))arr=arr.filter(m=>m.categoryId===(override.category||r.category));
 if((override.subcategory||r.subcategory))arr=arr.filter(m=>m.subcategoryId===(override.subcategory||r.subcategory));
 const concept=(override.concept!==undefined?override.concept:r.concept||"").trim().toLowerCase();
 if(concept)arr=arr.filter(m=>String(m.merchant||"").toLowerCase().includes(concept));
 const dateMode=override.dateMode||r.dateMode;
 if(dateMode==="months"){
  const a=override.startMonth||r.startMonth,b=override.endMonth||r.endMonth;
  const min=a<b?a:b,max=a>b?a:b;arr=arr.filter(m=>{const k=monthKey(m.date);return k>=min&&k<=max});
 } else if(dateMode==="dates"){
  const a=override.startDate||r.startDate,b=override.endDate||r.endDate;
  if(a)arr=arr.filter(m=>m.date>=a);if(b)arr=arr.filter(m=>m.date<=b);
 }
 return arr;
}
function reportLabelForMovement(m,groupBy){
 if(groupBy==="category")return categoryById(m.categoryId)?.name||"Sin categoría";
 if(groupBy==="subcategory")return subcategoryById(m.categoryId,m.subcategoryId)?.name||"Sin subcategoría";
 if(groupBy==="account")return byId(state.accounts,m.accountId)?.name||"Sin cuenta";
 if(groupBy==="month")return monthLabel(monthKey(m.date));
 return String(m.merchant||"Sin concepto").trim()||"Sin concepto";
}
function groupReportMovements(arr,groupBy){
 const map=new Map();
 arr.forEach(m=>{const key=groupBy==="concept"?String(m.merchant||"Sin concepto").trim().toLowerCase():reportLabelForMovement(m,groupBy);if(!map.has(key))map.set(key,{key,label:reportLabelForMovement(m,groupBy),amount:0,count:0,avg:0,last:"",movements:[]});const g=map.get(key);g.amount+=movementAmount(m);g.count++;g.last=!g.last||m.date>g.last?m.date:g.last;g.movements.push(m);});
 return [...map.values()].map(g=>({...g,avg:g.count?g.amount/g.count:0}));
}
function sortReportGroups(groups,sortBy){return groups.sort((a,b)=>sortBy==="count"?b.count-a.count:sortBy==="average"?b.avg-a.avg:sortBy==="recent"?b.last.localeCompare(a.last):b.amount-a.amount)}

function renderReportComparison(out,r){

 const ta=a.reduce((s,m)=>s+movementAmount(m),0),tb=b.reduce((s,m)=>s+movementAmount(m),0),delta=tb-ta,pct=ta?(delta/ta)*100:0;
 out.innerHTML=`<div class="grid"><section class="card span-12"><div class="report-result-head"><div><h2>${esc(monthLabel(r.compareA))} vs ${esc(monthLabel(r.compareB))}</h2><div class="muted">Comparación por ${esc(r.compareBy)} · ${rows.length} grupos</div></div><button class="btn" id="exportCompare">Exportar comparativa</button></div><div class="kpi-grid" style="margin-top:14px"><div class="kpi"><div class="muted">Mes A</div><strong>${euro(ta)}</strong><small>${a.length} operaciones</small></div><div class="kpi"><div class="muted">Mes B</div><strong>${euro(tb)}</strong><small>${b.length} operaciones</small></div><div class="kpi"><div class="muted">Diferencia</div><strong class="${delta>0?"negative":"positive"}">${delta>0?"+":""}${euro(delta)}</strong></div><div class="kpi"><div class="muted">Variación</div><strong class="${pct>0?"negative":"positive"}">${pct>0?"+":""}${pct.toFixed(1)}%</strong></div></div></section><section class="card span-12"><h2>Comparativa detallada</h2><div class="table-wrap"><table class="table"><thead><tr><th>${esc(r.compareBy)}</th><th>${esc(monthLabel(r.compareA))}</th><th>${esc(monthLabel(r.compareB))}</th><th>Δ</th><th>Δ %</th><th>Operaciones A/B</th><th></th></tr></thead><tbody>${rows.map(x=>{const d=x.b-x.a,p=x.a?(d/x.a)*100:(x.b?100:0);return `<tr><td>${esc(x.label)}</td><td>${euro(x.a)}</td><td>${euro(x.b)}</td><td class="${d>0?"negative":"positive"}">${d>0?"+":""}${euro(d)}</td><td class="${p>0?"negative":"positive"}">${p>0?"+":""}${p.toFixed(1)}%</td><td>${x.ca} / ${x.cb}</td><td><button class="btn small" data-compare-group="${encodeURIComponent(x.key)}">Ver A/B</button></td></tr>`}).join("")||`<tr><td colspan="7" class="empty">No hay datos para comparar.</td></tr>`}</tbody></table></div></section></div>`;

function renderInvestments(){
 content.innerHTML=`<h1>Inversiones</h1><div class="subtitle">Registra posiciones y controla su evolución. El precio puede actualizarse manualmente o mediante una consulta pública cuando el proveedor lo permita.</div>

 document.getElementById("newInv").onclick=()=>investmentModal();

 content.querySelectorAll("[data-edit-i]").forEach(b=>b.onclick=()=>investmentModal(b.dataset.editI));content.querySelectorAll("[data-del-i]").forEach(b=>b.onclick=()=>deleteInvestment(b.dataset.delI));
}
function investmentModal(id){
 const i=id?byId(state.investments,id):null;
 modalOpen(id?"Editar inversión":"Nueva inversión",`<form id="invForm" class="form-grid"><div class="field"><label>Nombre</label><input id="iName" value="${esc(i?.name||"")}" required></div><div class="field"><label>Ticker</label><input id="iTicker" value="${esc(i?.ticker||"")}" placeholder="AMD, ORCL…"></div><div class="field"><label>Unidades</label><input id="iShares" type="number" step="0.000001" min="0" value="${esc(i?.shares||"")}" required></div><div class="field"><label>Precio actual (€)</label><input id="iPrice" type="number" step="0.0001" min="0" value="${esc(i?.price||"")}" required></div><div class="field"><label>Coste medio (€)</label><input id="iCost" type="number" step="0.0001" min="0" value="${esc(i?.avgCost||"")}" required></div><div class="actions full"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="cancelI">Cancelar</button></div></form>`);
 document.getElementById("cancelI").onclick=modalClose;document.getElementById("invForm").onsubmit=e=>{e.preventDefault();const obj=i||{id:uid()};Object.assign(obj,{name:document.getElementById("iName").value.trim(),ticker:document.getElementById("iTicker").value.trim().toUpperCase(),shares:Number(document.getElementById("iShares").value),price:Number(document.getElementById("iPrice").value),avgCost:Number(document.getElementById("iCost").value)});if(!i)state.investments.push(obj);save();modalClose();renderInvestments();toast("Inversión guardada.");};

function deleteInvestment(id){if(!confirm("¿Eliminar esta inversión?"))return;state.investments=state.investments.filter(i=>i.id!==id);save();renderInvestments();toast("Inversión eliminada.");}
async function refreshPrices(){
 if(!state.investments.length){toast("No hay inversiones.");return;}
 // Public Yahoo endpoint may be blocked by browser CORS. We attempt it and retain manual prices as fallback.
 let updated=0;
 for(const i of state.investments){
  if(!i.ticker)continue;
  try{
   const url="https://query1.finance.yahoo.com/v8/finance/chart/"+encodeURIComponent(i.ticker)+"?range=1d&interval=1m";
   const res=await fetch(url,{cache:"no-store"});const data=await res.json();const p=data?.chart?.result?.[0]?.meta?.regularMarketPrice;
   if(typeof p==="number"){i.price=p;updated++;}
  }catch(e){}
 }
 save();renderInvestments();toast(updated?`Precios actualizados: ${updated}.`:"El proveedor no permitió la consulta; se mantienen los precios manuales.");
}

/* ---------- Settings ---------- */
function renderSettings(){
 content.innerHTML=`<section class="card span-12" id="v25Profile"><h2>👤 Tu perfil</h2><div class="form-grid"><div class="field"><label>Nombre en I$T</label><input id="v25Name" maxlength="40" placeholder="¿Cómo quieres que te llamemos?" value="${esc(state.settings?.profile?.name||"")}"></div></div><div class="muted" style="margin-top:8px">Se utilizará para personalizar el mensaje de bienvenida.</div><div class="actions" style="margin-top:10px"><button class="btn primary" id="saveV25Profile">Guardar nombre</button></div></section>
<h1>Configuración</h1><div class="subtitle">Categorías, subcategorías, datos y parámetros generales.</div>
 <div class="grid">
 <section class="card span-6"><h2>Parámetros</h2><div class="form-grid"><div class="field"><label>TAE por defecto para nuevas cuentas remuneradas</label><input id="defaultRate" type="number" step="0.001" min="0" value="${esc(state.settings.defaultInterestRate)}"></div><div class="field"><label>Moneda</label><select id="currency"><option selected>EUR</option></select></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" id="saveSettings">Guardar configuración</button><button class="btn" id="runInterest">Calcular intereses ahora</button></div></section>
 <section class="card span-6"><h2>Copias de seguridad</h2><div class="notice" style="margin-bottom:12px">V2.1 migra automáticamente los datos de V2.0 y crea una copia de seguridad local antes de hacerlo.</div><div class="actions"><button class="btn primary" id="exportData">Exportar datos</button><button class="btn" id="importData">Importar datos</button><button class="btn danger" id="resetData">Borrar todos los datos</button></div><p class="muted" style="margin-top:12px">La exportación contiene cuentas, movimientos, recurrentes, inversiones, categorías y configuración.</p><input id="fileImport" type="file" accept="application/json" class="hidden"></section>
 <section class="card span-12 category-settings-card"><div class="settings-link-row"><div><h2 style="margin-bottom:4px">🏷️ Categorías y subcategorías</h2><div class="muted">${state.categories.length} categorías · ${state.categories.reduce((n,c)=>n+(c.subcategories?.length||0),0)} subcategorías</div></div><button class="btn primary" id="manageCategories">Gestionar →</button></div></section>
 <section class="card span-6"><h2>Objetivos</h2><p class="muted">Objetivos sencillos para seguir el progreso desde el Resumen.</p>
 <form id="goalForm"><div class="form-grid"><div class="field"><label>Nombre</label><input id="goalName" required></div><div class="field"><label>Objetivo (€)</label><input id="goalTarget" type="number" step="0.01" min="0" required></div><div class="field"><label>Actual (€)</label><input id="goalCurrent" type="number" step="0.01" min="0" value="0"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">Añadir objetivo</button></div></form>
 <div class="list" style="margin-top:12px">${(state.goals||[]).map(g=>{const q=goalProgress(g);return `<div class="list-row"><span>${esc(g.name)} · ${Math.round(q.pct)}%</span><strong>${euro(q.current)} / ${euro(q.target)} <button class="btn small danger" data-del-goal="${g.id}">Eliminar</button></strong></div>`}).join("")||`<div class="empty">Sin objetivos.</div>`}</div>
 </section>
 </div>`;
 document.getElementById("saveSettings").onclick=()=>{state.settings.defaultInterestRate=Number(document.getElementById("defaultRate").value)||0;save();toast("Configuración guardada.");};
 document.getElementById("runInterest").onclick=()=>{accrueInterest();toast("Intereses recalculados.");renderSettings()};
 document.getElementById("exportData").onclick=exportData;
 document.getElementById("importData").onclick=()=>document.getElementById("fileImport").click();
 document.getElementById("fileImport").onchange=e=>importData(e.target.files[0]);
 document.getElementById("resetData").onclick=resetData;
 document.getElementById("goalForm").onsubmit=e=>{e.preventDefault();const name=document.getElementById("goalName").value.trim(),target=Number(document.getElementById("goalTarget").value),current=Number(document.getElementById("goalCurrent").value)||0;if(!name||target<=0)return;state.goals.push({id:uid(),name,target,current});save();renderSettings();toast("Objetivo añadido.");};
 content.querySelectorAll("[data-del-goal]").forEach(b=>b.onclick=()=>{state.goals=state.goals.filter(g=>g.id!==b.dataset.delGoal);save();renderSettings();});
 document.getElementById("manageCategories").onclick=()=>{currentRoute="categories";localStorage.setItem("ist_route",currentRoute);renderNav();renderMobileNav();render();};
 if(document.getElementById("saveV25Profile")) document.getElementById("saveV25Profile").onclick=()=>{state.settings ||= {};state.settings.profile ||= {};state.settings.profile.name=document.getElementById("v25Name").value.trim();save();toast("Nombre guardado.");renderSettings();};
}
function renderCategories(){
 state.ui ||= {}; state.ui.openCategories ||= {};
 content.innerHTML=`<div class="page-head-back"><button class="btn" id="backSettings">← Configuración</button></div><h1>🏷️ Categorías</h1><div class="subtitle">Gestiona categorías y subcategorías sin saturar la pantalla.</div>
 <div class="actions" style="margin-bottom:12px"><button class="btn primary" id="addCat">+ Nueva categoría</button></div>
 <div class="card category-manager-card"><div class="category-list">${state.categories.map(c=>{const open=!!state.ui.openCategories[c.id];return `<div class="category-list-row"><div class="cat-row-main"><button class="cat-toggle" data-toggle-cat="${c.id}" aria-label="${open?'Cerrar':'Abrir'} ${esc(c.name)}">${open?'⌄':'›'}</button><div><strong>${esc(c.name)}</strong><div class="muted cat-meta">${c.subcategories?.length||0} subcategorías</div></div></div><div class="actions"><button class="btn small" data-edit-cat="${c.id}">Editar</button><button class="btn small danger" data-del-cat="${c.id}">Eliminar</button></div></div>${open?`<div class="subcat-panel"><div class="subcat-list">${(c.subcategories||[]).map(sub=>`<div class="subcat-row"><span>${esc(sub.name)}</span><button class="btn small danger" data-del-sub="${c.id}|${sub.id}">Eliminar</button></div>`).join("")||`<div class="empty">Sin subcategorías.</div>`}</div><button class="btn small" data-add-sub="${c.id}" style="margin-top:9px">+ Subcategoría</button></div>`:""}`}).join("")||`<div class="empty">No hay categorías.</div>`}</div></div>`;
 document.getElementById("backSettings").onclick=()=>{currentRoute="settings";localStorage.setItem("ist_route",currentRoute);renderNav();renderMobileNav();render()};
 document.getElementById("addCat").onclick=()=>categoryModal();
 content.querySelectorAll("[data-toggle-cat]").forEach(b=>b.onclick=()=>{state.ui.openCategories[b.dataset.toggleCat]=!state.ui.openCategories[b.dataset.toggleCat];save();renderCategories()});
 content.querySelectorAll("[data-edit-cat]").forEach(b=>b.onclick=()=>categoryModal(b.dataset.editCat));
 content.querySelectorAll("[data-del-cat]").forEach(b=>b.onclick=()=>deleteCategory(b.dataset.delCat));
 content.querySelectorAll("[data-add-sub]").forEach(b=>b.onclick=()=>subcategoryModal(b.dataset.addSub));
 content.querySelectorAll("[data-del-sub]").forEach(b=>b.onclick=()=>deleteSubcategory(...b.dataset.delSub.split("|")));
}
function categoryModal(id){
 const c=id?categoryById(id):null;
 modalOpen(id?"Editar categoría":"Nueva categoría",`<form id="catForm"><div class="field"><label>Nombre</label><input id="catName" value="${esc(c?.name||"")}" required></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar</button></div></form>`);
 document.getElementById("catForm").onsubmit=e=>{e.preventDefault();const n=document.getElementById("catName").value.trim();if(!n)return;const obj=c||{id:uid(),subcategories:[]};obj.name=n;if(!c)state.categories.push(obj);save();modalClose();renderSettings();};
}
function subcategoryModal(cid){
 modalOpen("Nueva subcategoría",`<form id="subForm"><div class="field"><label>Nombre</label><input id="subName" required></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Guardar</button></div></form>`);
 document.getElementById("subForm").onsubmit=e=>{e.preventDefault();const n=document.getElementById("subName").value.trim();if(!n)return;categoryById(cid).subcategories.push({id:uid(),name:n});save();modalClose();renderSettings();};
}
function deleteCategory(id){if(state.movements.some(m=>m.categoryId===id)){toast("No puedes eliminar una categoría usada en movimientos.");return;}if(!confirm("¿Eliminar categoría y sus subcategorías?"))return;state.categories=state.categories.filter(c=>c.id!==id);save();renderSettings();}
function deleteSubcategory(cid,sid){if(state.movements.some(m=>m.categoryId===cid&&m.subcategoryId===sid)){toast("No puedes eliminar una subcategoría usada.");return;}if(!confirm("¿Eliminar subcategoría?"))return;const c=categoryById(cid);c.subcategories=c.subcategories.filter(s=>s.id!==sid);save();renderSettings();}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`IST-backup-${dateISO()}.json`;a.click();URL.revokeObjectURL(a.href);}
function importData(file){
 if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.accounts||!x.movements||!x.categories)throw Error();state=x;state.settings ||= {currency:"EUR",defaultInterestRate:2.02,lastInterestRun:{}};save();render();toast("Datos importados.");}catch(e){toast("Archivo no válido.");}};r.readAsText(file);
}
function resetData(){if(!confirm("Esto borrará TODOS los datos de la aplicación. ¿Continuar?"))return;state=emptyState();save();render();toast("Datos borrados.");}

/* ---------- Render ---------- */
function render(){
 accrueInterest();
 applyRecurrings();
 renderNav();
 renderMobileNav();
 if(currentRoute==="summary")renderSummary();
 else if(currentRoute==="movements")renderMovements();
 else if(currentRoute==="accounts")renderAccounts();
 else if(currentRoute==="recurrings")renderRecurrings();
 else if(currentRoute==="budgets")renderBudgets();
 else if(currentRoute==="reports")renderReports();
 else if(currentRoute==="categories")renderCategories();
 else if(currentRoute==="investments")renderInvestments();
 else if(currentRoute==="settings")renderSettings();
}
state.ui ||= {};
render();
window.addEventListener("online",()=>toast("Conexión recuperada."));
window.addEventListener("load",()=>{if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});});
})();

function renderTransferSummary(){
 const c=document.getElementById("transferCount"),t=document.getElementById("transferTotal");
 if(!c||!t)return;
 const tx=state.movements.filter(isTransfer);
 c.textContent=String(tx.length);
 t.textContent=euro(tx.reduce((s,m)=>s+movementAmount(m),0));
}

</script>

<script id="v261-global-budget-nav">
document.addEventListener("click",function(e){
 const btn=e.target.closest && e.target.closest("#goBudgets");
 if(!btn)return;
 e.preventDefault();
 e.stopPropagation();
 currentRoute="budgets";
 try{localStorage.setItem("ist_route","budgets")}catch(err){}
 if(typeof renderNav==="function")renderNav();
 if(typeof renderMobileNav==="function")renderMobileNav();
 if(typeof closeMenu==="function")closeMenu();
 if(typeof render==="function")render();
 window.scrollTo(0,0);
});
</script>
</body>
</html>
