name: Build I$T V2.11

on:
  push:
    branches: [main]
    paths:
      - 'v211.js'
      - '.github/workflows/v211-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, 'Build V2.11 assets') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V2.11 assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>I$T V2.10</title>','<title>I$T V2.11</title>')
          if 'v211.js?v=2110' not in s:
              s=s.replace('</body>','<script src="v211.js?v=2110"></script>\n</body>')
          p.write_text(s,encoding='utf-8')

          m=Path('manifest.webmanifest')
          x=m.read_text(encoding='utf-8')
          x=x.replace('"src":"icon-192.png",\n      "sizes": "120x120"','"src":"icon-120.png",\n      "sizes": "120x120"')
          m.write_text(x,encoding='utf-8')

          sw=Path('service-worker.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace('ist-v2104-clean','ist-v2110-quality')
          if '"./v211.js"' not in w:
              w=w.replace('"./index.html",','"./index.html","./v211.js",')
          sw.write_text(w,encoding='utf-8')
      - name: Commit V2.11 assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest service-worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Build V2.11 assets"
          git push
